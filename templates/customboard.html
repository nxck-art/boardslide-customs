{% extends "base.html" %}

{% block content %}
<h1>Build Your Skateboard</h1>

<form method="POST">

  <label>Deck:</label><br>
  <select name="deck">
    {% for item in decks %}
      <option value="{{ item.id }}">{{ item.name }} - ${{ item.price }}</option>
    {% endfor %}
  </select><br><br>

  <label>Wheels:</label><br>
  <select name="wheels">
    {% for item in wheels %}
      <option value="{{ item.id }}">{{ item.name }} - ${{ item.price }}</option>
    {% endfor %}
  </select><br><br>

  <label>Bearings:</label><br>
  <select name="bearing">
    {% for item in bearings %}
      <option value="{{ item.id }}">{{ item.name }} - ${{ item.price }}</option>
    {% endfor %}
  </select><br><br>

  <label>Trucks:</label><br>
  <select name="trucks">
    {% for item in trucks %}
      <option value="{{ item.id }}">{{ item.name }} - ${{ item.price }}</option>
    {% endfor %}
  </select><br><br>

  <label>Griptape:</label><br>
  <select name="griptape">
    {% for item in griptape %}
      <option value="{{ item.id }}">{{ item.name }} - ${{ item.price }}</option>
    {% endfor %}
  </select><br><br>

  <label>Design:</label><br>
  <select name="design">
    {% for item in designs %}
      <option value="{{ item.id }}">{{ item.name }} - ${{ item.price }}</option>
    {% endfor %}
  </select><br><br>

  <button type="submit">Build Skateboard</button>

</form>

{% endblock %}
